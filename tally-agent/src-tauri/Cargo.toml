[package]
name = "fininsight-tally-agent"
version = "0.1.0"
description = "FinInsight Tally Desktop Sync Agent"
authors = ["FinInsight"]
edition = "2021"
rust-version = "1.77"
default-run = "fininsight-tally-agent"

[lib]
name = "fininsight_tally_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
quick-xml = { version = "0.37", features = ["serialize"] }
keyring = "3"
log = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1"
once_cell = "1"
env_logger = "0.11"
opener = "0.7"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[[bin]]
name = "tally-ping"
path = "src/bin/tally-ping.rs"
